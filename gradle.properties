# Pin the Gradle daemon JVM to Java 21.
# Gradle 8.14's embedded Groovy uses an ASM version that cannot read
# class files compiled with JDK 25 (major version 69), which causes
# build-script compilation to fail when the Groovy plugin is applied.
# Java 21 is the targeted source/target compatibility for this project.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home

